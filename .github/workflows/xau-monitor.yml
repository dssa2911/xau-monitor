name: DSSA Signal

on:
  schedule:
    # hourly while gold trades (UTC): Sun 22:00 -> Fri 22:00. Each run lives ~5h40m, so there is always one waiting to take over.
    - cron: '5 22-23 * * 0'
    - cron: '5 * * * 1-4'
    - cron: '5 0-21 * * 5'
  workflow_dispatch:          # "Run workflow" button for a manual test

concurrency:
  group: dssa-signal
  cancel-in-progress: false

permissions:
  contents: read
  actions: write              # keep-alive step below

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      # GitHub turns scheduled workflows off after 60 days without repo activity; re-enabling every run keeps it on.
      - name: Keep schedule alive
        continue-on-error: true
        run: >
          curl -s -o /dev/null -w "keep-alive %{http_code}\n" -X PUT
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json"
          "https://api.github.com/repos/${{ github.repository }}/actions/workflows/xau-monitor.yml/enable"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: xau-state-${{ github.run_id }}
          restore-keys: xau-state-
      # GitHub starts scheduled runs 10-30 min late, so one run stays up ~5h40m. From 3 s after
      # every M5 close it retries every 3 s until setra shows the new candle (~2-3 s), so signals
      # land seconds after the close. The next scheduled run waits (concurrency) and takes over.
      - name: Run monitor
        run: |
          end=$(( $(date +%s) + 340 * 60 )); fails=0
          while :; do
            for try in $(seq 1 10); do
              out=$(node monitor.mjs 2>&1) || fails=$((fails + 1))
              echo "$out"
              echo "$out" | grep -q 'no new candle' || break
              sleep 3
            done
            next=$(( ($(date +%s) / 300 + 1) * 300 + 3 ))
            [ "$next" -ge "$end" ] && break
            sleep $(( next - $(date +%s) ))
          done
          [ "$fails" -eq 0 ]
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Expiry of the TradingView alert that sends the same signals faster. Empty = this bot sends.
          TV_ALERT_UNTIL: '2026-12-13T02:51:44Z'   # alert 5841478272
      - name: Save state
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: xau-state-${{ github.run_id }}
