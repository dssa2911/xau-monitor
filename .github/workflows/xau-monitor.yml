name: DSSA Signal

on:
  schedule:
    # every 15 minutes while gold trades (UTC): Sun 22:00 -> Fri 22:00. GitHub may start a few minutes late.
    - cron: '*/15 22-23 * * 0'
    - cron: '*/15 * * * 1-4'
    - cron: '*/15 0-21 * * 5'
  workflow_dispatch:          # "Run workflow" button for a manual test

concurrency:
  group: dssa-signal
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: xau-state-${{ github.run_id }}
          restore-keys: xau-state-
      - name: Run monitor
        run: node monitor.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save state
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: xau-state-${{ github.run_id }}
