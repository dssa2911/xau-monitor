name: XAU Telegram Monitor

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes (GitHub may start a few minutes late)
  workflow_dispatch:          # "Run workflow" button for a manual test

concurrency:
  group: xau-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: xau-state-${{ github.run_id }}
          restore-keys: xau-state-
      - name: Run monitor
        run: node monitor.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save state
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: xau-state-${{ github.run_id }}
